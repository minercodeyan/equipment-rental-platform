<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
    <!-- Иконка: гидроцикл + волна -->
    <g>
        <!-- Корпус гидроцикла -->
        <path d="M8 40 C 8 34, 14 30, 22 30 L 40 30 C 50 30, 58 34, 62 40 L 64 44 L 6 44 Z"
              fill="#0EA5E9"/>
        <!-- Сиденье / руль -->
        <path d="M24 30 L 28 22 L 44 22 L 46 30 Z" fill="#0369A1"/>
        <rect x="30" y="14" width="12" height="4" rx="2" fill="#0EA5E9"/>
        <rect x="34" y="14" width="4" height="10" fill="#0369A1"/>
        <!-- Волны -->
        <path d="M2 48 C 10 44, 18 52, 26 48 C 34 44, 42 52, 50 48 C 58 44, 66 52, 72 48"
              stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M2 56 C 10 52, 18 60, 26 56 C 34 52, 42 60, 50 56 C 58 52, 66 60, 72 56"
              stroke="#7DD3FC" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- Текст -->
    <text x="88" y="34" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#0F172A">AQUA</text>
    <text x="88" y="52" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#0EA5E9">RENTAL</text>
</svg>
