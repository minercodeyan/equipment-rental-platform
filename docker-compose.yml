services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipment-rental-app
    working_dir: /var/www
    volumes:
      - ./code/:/var/www
    depends_on:
      - db
    networks:
      - crm

  nginx:
    image: nginx:alpine
    container_name: equipment-rental-nginx
    ports:
      - "8089:80"
    volumes:
      - ./code/:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - crm
  db:
    image: mysql:8.4
    container_name: equipment-rental-db
    environment:
      MYSQL_DATABASE: crm
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: crm
      MYSQL_PASSWORD: crm
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - crm

networks:
  crm:

volumes:
  mysql_data: